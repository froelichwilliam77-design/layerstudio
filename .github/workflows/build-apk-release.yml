name: Build Android APK Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.0'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Decode upload keystore (if secret present)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "${ANDROID_KEYSTORE_BASE64:-}" && -n "${ANDROID_KEYSTORE_PASSWORD:-}" && -n "${ANDROID_KEY_ALIAS:-}" && -n "${ANDROID_KEY_PASSWORD:-}" ]]; then
            echo "Release signing secrets detected — writing keystore + key.properties"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            {
              echo "storePassword=${ANDROID_KEYSTORE_PASSWORD}"
              echo "keyPassword=${ANDROID_KEY_PASSWORD}"
              echo "keyAlias=${ANDROID_KEY_ALIAS}"
              echo "storeFile=app/upload-keystore.jks"
            } > android/key.properties
            echo "SIGNING_MODE=release" >> "$GITHUB_ENV"
          else
            echo "WARNING: ANDROID_KEYSTORE_* secrets not fully set — APK will use debug signing fallback."
            echo "SIGNING_MODE=debug-fallback" >> "$GITHUB_ENV"
          fi

      - name: Build universal release APK
        run: flutter build apk --release

      - name: Build split-per-ABI release APKs
        run: flutter build apk --release --split-per-abi

      - name: Stage renamed APKs
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/LayerStudio.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/LayerStudio-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/LayerStudio-armv7.apk
          ls -lh dist/
          echo "Signing mode: ${SIGNING_MODE:-unknown}"

      - name: Resolve release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            VER=$(grep -E '^version:' pubspec.yaml | head -1 | awk '{print $2}' | cut -d+ -f1)
            VER=${VER:-1.1.0}
            TAG="v${VER}"
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
              n=1
              while gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${VER}-${n}" >/dev/null 2>&1; do
                n=$((n + 1))
              done
              TAG="v${VER}-${n}"
            fi
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: ${TAG}"

      - name: Create GitHub Release with APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          SHA="${GITHUB_SHA}"
          SHORT_SHA="${SHA:0:7}"
          SIGNING="${SIGNING_MODE:-unknown}"

          if [[ "$SIGNING" == "release" ]]; then
            SIGN_NOTE="Release-signed with the upload keystore (sideload / internal distribution — not Play Store published by this workflow)."
          else
            SIGN_NOTE="WARNING: Built with **debug signing fallback** (upload keystore secrets were missing)."
          fi

          NOTES="$(cat <<NOTESEOF
          # LayerStudio ${TAG}

          ${SIGN_NOTE}

          Built from commit \`${SHORT_SHA}\` (\`${SHA}\`) on branch/ref \`${GITHUB_REF_NAME}\`.

          ## Downloads
          - **LayerStudio.apk** — universal (all ABIs) — use if unsure
          - **LayerStudio-arm64.apk** — most modern phones (arm64-v8a)
          - **LayerStudio-armv7.apk** — older 32-bit phones (armeabi-v7a)

          ## Install
          1. Download the APK on your Android phone
          2. Open it and allow install from unknown sources if prompted
          3. Open **LayerStudio**
          NOTESEOF
          )"

          NOTES="$(printf '%s\n' "$NOTES" | sed 's/^          //')"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; uploading/updating assets"
            gh release upload "$TAG" \
              dist/LayerStudio.apk \
              dist/LayerStudio-arm64.apk \
              dist/LayerStudio-armv7.apk \
              --clobber
            gh release edit "$TAG" --notes "$NOTES" || true
          else
            gh release create "$TAG" \
              dist/LayerStudio.apk \
              dist/LayerStudio-arm64.apk \
              dist/LayerStudio-armv7.apk \
              --title "LayerStudio ${TAG} — Android APKs" \
              --notes "$NOTES" \
              --target "$SHA"
          fi

          echo "Release URL: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
