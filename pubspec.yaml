name: layerstudio
description: Beginner-friendly phone music studio (mobile DAW) — BandLab/GarageBand-style.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_soloud: ^3.5.4
  provider: ^6.1.5+1
  path_provider: ^2.1.5
  share_plus: ^12.0.2
  wakelock_plus: ^1.4.0
  uuid: ^4.6.0
  intl: ^0.20.3
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/samples/drums/
    - assets/samples/bass/
    - assets/samples/guitar/
    - assets/samples/keys/
