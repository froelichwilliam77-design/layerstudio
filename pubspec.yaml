name: layerstudio
description: Beat-maker-first phone music studio (mobile DAW) — LayerStudio.
publish_to: 'none'
version: 1.1.9+12

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_soloud: ^3.5.4
  provider: ^6.1.5+1
  path_provider: ^2.1.5
  share_plus: ^12.0.2
  wakelock_plus: ^1.4.0
  uuid: ^4.6.0
  intl: ^0.20.3
  collection: ^1.19.1
  audio_session: ^0.2.4
  archive: ^4.2.0
  file_picker: ^11.0.3
  path: ^1.9.1
  shared_preferences: ^2.5.3
  record: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/samples/drums/
    - assets/samples/bass/
    - assets/samples/guitar/
    - assets/samples/keys/
